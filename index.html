<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            text-align: center;
        }
        .lesson-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .btn-lesson {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #dee2e6;
            background-color: #ffffff;
            color: #495057;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-lesson:hover {
            border-color: #4c6ef5;
            color: #4c6ef5;
        }
        .btn-lesson.active {
            background-color: #4c6ef5;
            border-color: #4c6ef5;
            color: #ffffff;
        }
        .btn-lesson.memory {
            border-color: #fcc419;
            color: #f59f00;
        }
        .btn-lesson.memory:hover {
            border-color: #f59f00;
            color: #f59f00;
        }
        .btn-lesson.memory.active {
            background-color: #f59f00;
            border-color: #f59f00;
            color: #ffffff;
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .btn-mode {
            flex: 1;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: 600;
            border: 2px solid #ced4da;
            background-color: #f8f9fa;
            color: #495057;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mode:hover {
            border-color: #20c997;
            color: #20c997;
        }
        .btn-mode.active {
            background-color: #20c997;
            border-color: #20c997;
            color: #ffffff;
        }
        .header {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }
        .memory-info-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-memory-reset {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border: 1px solid #f59f00;
            background-color: #fff9e6;
            color: #f59f00;
            border-radius: 12px;
            cursor: pointer;
            flex: none;
            transition: all 0.2s;
        }
        .btn-memory-reset:hover {
            background-color: #f59f00;
            color: #ffffff;
        }
        .word-card {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 24px;
            position: relative;
        }
        .korean-word {
            font-size: 32px;
            font-weight: bold;
            color: #212529;
            word-break: keep-all;
        }
        .btn-star {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #adb5bd;
            transition: transform 0.2s, color 0.2s;
            width: auto;
            padding: 0;
        }
        .btn-star:hover {
            transform: scale(1.15);
        }
        .btn-star.active {
            color: #f59f00;
        }
        .trace-toggle-wrap {
            margin-bottom: 16px;
        }
        .btn-trace-toggle {
            width: 100%;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #4c6ef5;
            background-color: #ffffff;
            color: #4c6ef5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-trace-toggle:hover {
            background-color: #edf2ff;
        }
        .btn-trace-toggle.active {
            background-color: #4c6ef5;
            color: #ffffff;
        }
        .trace-section {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .trace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: #495057;
            font-weight: 600;
            word-break: keep-all;
            text-align: left;
        }
        .btn-trace-clear {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background-color: #e9ecef;
            color: #495057;
            border-radius: 6px;
            cursor: pointer;
            flex: none;
        }
        .btn-trace-clear:hover {
            background-color: #dee2e6;
        }
        #trace-canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 400 / 220;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            touch-action: none;
            cursor: crosshair;
        }
        .trace-hint {
            font-size: 11px;
            color: #adb5bd;
            margin-top: 6px;
            text-align: left;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="text"]:focus {
            border-color: #4d90fe;
        }
        .feedback {
            min-height: 24px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .feedback.correct {
            color: #2b8a3e;
        }
        .feedback.incorrect {
            color: #e03131;
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .btn-prev {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn-prev:hover {
            background-color: #dee2e6;
        }
        .btn-submit {
            background-color: #3b5bdb;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #364fc7;
        }
        .btn-next {
            background-color: #4c6ef5;
            color: #ffffff;
        }
        .btn-next:hover {
            background-color: #4263eb;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lesson-selector" id="lesson-selector">
        <button class="btn-lesson active" onclick="selectLesson(event, 'all')">전체</button>
        <button class="btn-lesson" onclick="selectLesson(event, '1')">1과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '2')">2과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '3')">3과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '4')">4과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '5')">5과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '6')">6과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '7')">7과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '8')">8과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '9')">9과</button>
        <button class="btn-lesson" onclick="selectLesson(event, '10')">10과</button>
        <button class="btn-lesson memory" onclick="selectLesson(event, 'memory')">★ 기억 단어장</button>
    </div>

    <div class="mode-selector" id="mode-selector">
        <button class="btn-mode active" id="mode-korean" onclick="selectQuizMode('korean')">한글 ➔ 히라가나</button>
        <button class="btn-mode" id="mode-japanese" onclick="selectQuizMode('japanese')">히라가나 ➔ 한글</button>
        <button class="btn-mode" id="mode-kanji" onclick="selectQuizMode('kanji')">한자 ➔ 히라가나</button>
    </div>

    <div class="header">
        <span id="progress-info">문제 0 / 0</span>
        <div class="memory-info-group">
            <span id="memory-count-info" style="font-size: 12px; color: #f59f00;">기억 단어: 0개</span>
            <button type="button" class="btn-memory-reset" id="btn-memory-reset" onclick="resetMemoryWords()" title="기억 단어장 전체 초기화">전체 초기화</button>
        </div>
    </div>

    <div class="word-card">
        <button type="button" class="btn-star" id="btn-star" onclick="toggleMemoryWord()" title="기억 단어장에 저장/해제">★</button>
        <div class="korean-word" id="korean-text">-</div>
    </div>

    <div class="trace-toggle-wrap">
        <button type="button" class="btn-trace-toggle" id="btn-trace-toggle" onclick="toggleTraceSection()">✍️ 따라쓰기 연습</button>
    </div>

    <div class="trace-section" id="trace-section" style="display:none;">
        <div class="trace-header">
            <span id="trace-target-label">따라쓰기: -</span>
            <button type="button" class="btn-trace-clear" onclick="clearTraceCanvas()">지우기</button>
        </div>
        <canvas id="trace-canvas" width="400" height="220"></canvas>
        <div class="trace-hint">마우스, 손가락, S펜/애플펜슬로 회색 글자 위에 따라 써보세요.</div>
    </div>

    <form id="quiz-form" onsubmit="handleFormSubmit(event)">
        <div class="input-group">
            <input
                    type="text"
                    id="japanese-input"
                    placeholder="답 입력 (Enter로 제출)"
                    autocomplete="off"
            >
        </div>

        <div class="feedback" id="feedback-text"></div>

        <div class="btn-group">
            <button type="button" class="btn-prev" id="btn-prev" onclick="goPrevious()">이전</button>
            <button type="submit" class="btn-submit" id="btn-submit">확인</button>
            <button type="button" class="btn-next" id="btn-next" onclick="goNext()">다음</button>
        </div>
    </form>
</div>

    let currentLesson = 'all';

    function shuffle(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function extractKanji(text) {
        if (!text) return '';
        const match = text.match(/\((.*?)\)/);
        return match ? match[1] : '';
    }

    function removeKanji(text) {
        if (!text) return '';
        return text.replace(/\s*\(.*?\)\s*/g, '').trim();
    }

    function getQuestionText(wordObj) {
        if (!wordObj) return '-';
        if (quizMode === 'korean') {
            return wordObj.korean;
        } else if (quizMode === 'japanese') {
            const kanji = extractKanji(wordObj.korean);
            const pureJapanese = removeKanji(wordObj.japanese);
            return kanji ? `${pureJapanese} (${kanji})` : pureJapanese;
        } else if (quizMode === 'kanji') {
            const kanji = extractKanji(wordObj.korean);
            return kanji ? kanji : wordObj.korean;
        }
    }

    function getCorrectAnswer(wordObj) {
        if (!wordObj) return '';
        if (quizMode === 'korean' || quizMode === 'kanji') {
            return wordObj.japanese;
        } else {
            return wordObj.korean;
        }
    }

    function getTraceText(wordObj) {
        if (!wordObj) return '';
        const kanji = extractKanji(wordObj.korean);
        return kanji || wordObj.japanese;
    }

    function loadMemoryWords() {
        try {
            const stored = localStorage.getItem('japanese_memory_words');
            if (stored) {
                memoryWords = JSON.parse(stored);
            }
        } catch (e) {
            storageAvailable = false;
            memoryWords = [];
            console.warn('localStorage 접근 불가. 메모리 세션 사용.', e);
        }
        updateMemoryCountUI();
    }

    function saveMemoryWords() {
        if (storageAvailable) {
            try {
                localStorage.setItem('japanese_memory_words', JSON.stringify(memoryWords));
            } catch (e) {
                storageAvailable = false;
            }
        }
        updateMemoryCountUI();
    }

    function updateMemoryCountUI() {
        const countEl = document.getElementById('memory-count-info');
        if (countEl) {
            countEl.textContent = `기억 단어: ${memoryWords.length}개`;
        }
    }

    function isMemoryWord(word) {
        if (!word) return false;
        return memoryWords.some(item => item.japanese === word.japanese && item.korean === word.korean);
    }

    function toggleMemoryWord() {
        if (currentIndex < 0 || historyStack.length === 0) return;
        const currentQuestion = historyStack[currentIndex];

        const wordObj = { korean: currentQuestion.korean, japanese: currentQuestion.japanese };

        if (isMemoryWord(wordObj)) {
            memoryWords = memoryWords.filter(item => !(item.japanese === wordObj.japanese && item.korean === wordObj.korean));
        } else {
            memoryWords.push(wordObj);
        }

        saveMemoryWords();
        updateStarButtonState();
    }

    function resetMemoryWords() {
        if (memoryWords.length === 0) {
            alert('기억 단어장이 이미 비어 있습니다.');
            return;
        }

        const confirmed = confirm(`기억 단어장의 단어 ${memoryWords.length}개를 모두 삭제하시겠습니까?`);
        if (!confirmed) return;

        memoryWords = [];
        saveMemoryWords();
        updateStarButtonState();

        if (currentLesson === 'memory') {
            selectLesson(null, 'all');
        }
    }

    function updateStarButtonState() {
        const starBtn = document.getElementById('btn-star');
        if (currentIndex >= 0 && historyStack[currentIndex]) {
            const currentQuestion = historyStack[currentIndex];
            if (isMemoryWord(currentQuestion)) {
                starBtn.classList.add('active');
            } else {
                starBtn.classList.remove('active');
            }
        }
    }

    function selectQuizMode(mode) {
        quizMode = mode;

        document.getElementById('mode-korean').classList.toggle('active', mode === 'korean');
        document.getElementById('mode-japanese').classList.toggle('active', mode === 'japanese');
        document.getElementById('mode-kanji').classList.toggle('active', mode === 'kanji');

        const inputField = document.getElementById('japanese-input');
        if (mode === 'korean' || mode === 'kanji') {
            inputField.placeholder = '히라가나 입력 (Enter로 제출)';
        } else {
            inputField.placeholder = '한글 입력 (Enter로 제출)';
        }

        if (historyStack.length > 0 && currentIndex >= 0) {
            updateDisplay();
        }
    }

    function selectLesson(e, lessonKey) {
        currentLesson = lessonKey;

        const buttons = document.querySelectorAll('.btn-lesson');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (e && e.target) {
            e.target.classList.add('active');
        } else {
            const targetBtn = document.querySelector(`.btn-lesson[onclick*="'${lessonKey}'"]`);
            if (targetBtn) targetBtn.classList.add('active');
        }

        if (lessonKey === 'all') {
            activeWordList = [];
            Object.keys(wordList).forEach(key => {
                if (Array.isArray(wordList[key])) {
                    activeWordList = activeWordList.concat(wordList[key]);
                }
            });
        } else if (lessonKey === 'memory') {
            activeWordList = [...memoryWords];
            if (activeWordList.length === 0) {
                alert("기억 단어장에 저장된 단어가 없습니다.");
                selectLesson(null, 'all');
                return;
            }
        } else {
            activeWordList = wordList[lessonKey] || [];
            if (activeWordList.length === 0) {
                alert(`${lessonKey}과 단어 데이터가 존재하지 않아 전체 단어로 이동합니다.`);
                selectLesson(null, 'all');
                return;
            }
        }

        totalCount = activeWordList.length;
        initQuiz();
    }

    function initQuiz() {
        if (!activeWordList || activeWordList.length === 0) {
            activeWordList = [];
            Object.keys(wordList).forEach(key => {
                if (Array.isArray(wordList[key])) {
                    activeWordList = activeWordList.concat(wordList[key]);
                }
            });
        }

        totalCount = activeWordList.length;
        randomizedPool = shuffle(activeWordList);
        historyStack = [];
        currentIndex = -1;
        loadNextQuestion();
    }

    function updateDisplay() {
        if (currentIndex < 0 || !historyStack[currentIndex]) {
            document.getElementById('progress-info').textContent = `문제 0 / 0`;
            document.getElementById('korean-text').textContent = `-`;
            return;
        }

        const currentQuestion = historyStack[currentIndex];

        document.getElementById('progress-info').textContent = `문제 ${currentIndex + 1} / ${totalCount}`;
        document.getElementById('korean-text').textContent = getQuestionText(currentQuestion);

        const inputField = document.getElementById('japanese-input');
        if (quizMode === 'korean' || quizMode === 'kanji') {
            inputField.placeholder = '히라가나 입력 (Enter로 제출)';
        } else {
            inputField.placeholder = '한글 입력 (Enter로 제출)';
        }
        inputField.value = currentQuestion.userAnswer || '';

        const feedbackEl = document.getElementById('feedback-text');
        if (currentQuestion.isCorrect !== undefined) {
            if (currentQuestion.isCorrect) {
                feedbackEl.textContent = "정답입니다!";
                feedbackEl.className = "feedback correct";
            } else {
                feedbackEl.textContent = `오답입니다. (정답: ${getCorrectAnswer(currentQuestion)})`;
                feedbackEl.className = "feedback incorrect";
            }
        } else {
            feedbackEl.textContent = "";
            feedbackEl.className = "feedback";
        }

        document.getElementById('btn-prev').disabled = (currentIndex <= 0);
        updateStarButtonState();
        updateTraceGuide();
    }

    function loadNextQuestion() {
        if (!activeWordList || activeWordList.length === 0) return;

        if (currentIndex < historyStack.length - 1) {
            currentIndex++;
        } else {
            if (randomizedPool.length === 0) {
                randomizedPool = shuffle(activeWordList);
            }

            const nextWord = randomizedPool.pop();
            historyStack.push({
                korean: nextWord.korean,
                japanese: nextWord.japanese,
                userAnswer: '',
                isCorrect: undefined
            });
            currentIndex = historyStack.length - 1;
        }
        updateDisplay();
    }

    function checkAnswer(userInput, wordObj) {
        if (!wordObj) return false;
        const trimmedInput = userInput.trim();

        if (quizMode === 'korean' || quizMode === 'kanji') {
            const targetJapanese = wordObj.japanese.trim();
            const pureJapanese = removeKanji(targetJapanese);
            return (trimmedInput === targetJapanese || trimmedInput === pureJapanese);
        } else {
            const fullKorean = wordObj.korean.trim();
            const pureKorean = removeKanji(fullKorean);

            if (trimmedInput === fullKorean || trimmedInput === pureKorean) return true;

            const possibleAnswers = pureKorean.split(/[\/,]/).map(ans => ans.trim());
            return possibleAnswers.includes(trimmedInput);
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();

        if (currentIndex < 0 || !historyStack[currentIndex]) return;

        const inputField = document.getElementById('japanese-input');
        const userSubmit = inputField.value.trim();

        if (!userSubmit) return;

        const currentQuestion = historyStack[currentIndex];
        currentQuestion.userAnswer = userSubmit;

        const isCorrect = checkAnswer(userSubmit, currentQuestion);
        currentQuestion.isCorrect = isCorrect;

        const feedbackEl = document.getElementById('feedback-text');

        if (isCorrect) {
            feedbackEl.textContent = "정답입니다! 다음 문제로 이동합니다.";
            feedbackEl.className = "feedback correct";

            setTimeout(() => {
                loadNextQuestion();
            }, 600);
        } else {
            feedbackEl.textContent = `오답입니다. (정답: ${getCorrectAnswer(currentQuestion)})`;
            feedbackEl.className = "feedback incorrect";

            const wordObj = { korean: currentQuestion.korean, japanese: currentQuestion.japanese };
            if (!isMemoryWord(wordObj)) {
                memoryWords.push(wordObj);
                saveMemoryWords();
                updateStarButtonState();
            }
        }
    }

    function goPrevious() {
        if (currentIndex > 0) {
            currentIndex--;
            updateDisplay();
        }
    }

    function goNext() {
        loadNextQuestion();
    }

    function toggleTraceSection() {
        const section = document.getElementById('trace-section');
        const btn = document.getElementById('btn-trace-toggle');
        const willShow = (section.style.display === 'none' || !section.style.display);

        section.style.display = willShow ? 'block' : 'none';
        btn.classList.toggle('active', willShow);

        if (willShow) {
            initTraceCanvas();
            updateTraceGuide();
        }
    }

    function getCanvasPos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX - rect.left) * (canvas.width / rect.width),
            y: (evt.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function drawTraceGuide(text) {
        const canvas = document.getElementById('trace-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!text) return;

        let fontSize = 110;
        const maxWidth = canvas.width * 0.9;
        ctx.font = `bold ${fontSize}px sans-serif`;

        while (ctx.measureText(text).width > maxWidth && fontSize > 24) {
            fontSize -= 4;
            ctx.font = `bold ${fontSize}px sans-serif`;
        }

        ctx.fillStyle = '#d0d3d8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    function updateTraceGuide() {
        const section = document.getElementById('trace-section');
        if (!section || section.style.display === 'none' || !section.style.display) return;

        if (currentIndex < 0 || !historyStack[currentIndex]) return;

        const currentQuestion = historyStack[currentIndex];
        const text = getTraceText(currentQuestion);
        const label = document.getElementById('trace-target-label');
        if (label) {
            label.textContent = `따라쓰기: ${text}`;
        }
        drawTraceGuide(text);
    }

    function clearTraceCanvas() {
        if (currentIndex < 0 || !historyStack[currentIndex]) return;
        const currentQuestion = historyStack[currentIndex];
        drawTraceGuide(getTraceText(currentQuestion));
    }

    function initTraceCanvas() {
        if (isTraceCanvasInitialized) return;
        const canvas = document.getElementById('trace-canvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#3b5bdb';

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isDrawing = true;
            lastTracePos = getCanvasPos(canvas, e);
            if (canvas.setPointerCapture) {
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getCanvasPos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(lastTracePos.x, lastTracePos.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastTracePos = pos;
        });

        ['pointerup', 'pointercancel', 'pointerleave'].forEach(evtName => {
            canvas.addEventListener(evtName, () => {
                isDrawing = false;
            });
        });

        isTraceCanvasInitialized = true;
    }

    function startApp() {
        loadMemoryWords();
        selectLesson(null, 'all');
    }

    // iOS 환경에서 DOMContentLoaded / onload 누락 방지를 위한 즉시 실행 및 이벤트 바인딩
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
    } else {
        startApp();
    }
</script>
